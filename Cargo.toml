[package]
name = "nostr-mpc-poc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nostr-mpc-poc"
path = "src/main.rs"

[lib]
name = "mpc_poc_near"
path = "src/lib.rs"

[[bin]]
name = "mpc-cli"
path = "src/main.rs"

[[bin]]
name = "mpc-worker"
path = "src/bin/worker.rs"

[dependencies]
near-api = "0.8"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["default"] }
bs58 = "0.5"
hex = "0.4"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
getrandom = "0.2"
borsh = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
nostr-sdk = "0.44"
tokio-tungstenite = "0.26"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
